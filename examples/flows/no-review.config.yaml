# Copy these instance overrides/additions into L1 config.yaml.
# Lists replace as a whole. Keep standard flow for existing tasks.
tasks:
  config:
    defaultFlow:
      id: no-review
      version: '1'
completion.no-review:
  use: task/completion-check
  config:
    requireAcceptance: false
    requireChildrenComplete: true
  deps:
    tasks: tasks
    deliveries: delivery
    acceptance: acceptance
    plan: plan
    decisions: decisions
state.completed.no-review:
  use: task/state-completed
  config:
    key: completed
  deps:
    completion: completion.no-review
flow.no-review:
  use: task/flow
  config:
    id: no-review
    version: '1'
    terminalState: completed
    maxAutoAdvances: 4
    returnTargets: {}
    reopenState: ready
  deps:
    states:
    - state.ready
    - state.executing
    - state.completed.no-review
    store: sql
    tasks: tasks
    authz: permissions
    confirmation: confirmation
    tx: sql
    requests: sql
    changes: revisions
    audit: audit
    events: events
hook.flow:
  deps:
    flows:
    - flow.standard
    - flow.no-review
api.flow:
  deps:
    flows:
    - flow.standard
    - flow.no-review
