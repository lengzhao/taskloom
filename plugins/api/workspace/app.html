<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taskloom · 任务工作台</title>
<style>
[hidden]{display:none!important}:root{--paper:#f5f2e9;--ink:#233d36;--line:#d8d9cc;--accent:#b64f2e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 Georgia,"Songti SC",serif}header{padding:22px 5vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:25px;letter-spacing:-1px}small,.muted{color:#6a756c}main{max-width:1300px;margin:auto;padding:30px 5vw;display:grid;grid-template-columns:280px 1fr;gap:40px}section,aside{min-width:0}button,input,textarea{font:inherit}button{border:1px solid var(--ink);background:var(--ink);color:white;padding:8px 17px;cursor:pointer;border-radius:3px}button.secondary{background:transparent;color:var(--ink)}button:disabled{opacity:.4;cursor:default}input,textarea{width:100%;background:#fffdf7;border:1px solid var(--line);border-radius:3px;padding:9px 12px;color:var(--ink)}textarea{min-height:90px;resize:vertical}label{display:block;margin:13px 0 5px}form{margin-bottom:25px}.card{padding:17px 0;border-bottom:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;margin:7px 0;background:transparent;color:var(--ink);border-color:var(--line)}nav button.selected{border-left:4px solid var(--accent)}h2{font-size:32px;margin:0 0 15px}h3{font-size:18px}p{white-space:pre-wrap;overflow-wrap:anywhere}.badge{display:inline-block;background:#e3e8dc;padding:3px 10px;margin-right:10px;font-size:13px}#notice{padding:12px 5vw;color:var(--accent);min-height:45px}#login{max-width:500px;margin:50px auto;padding:20px}details{border:1px solid var(--line);padding:13px;margin:20px 0}summary{cursor:pointer}.row{display:flex;gap:10px;align-items:center}.commit{border-left:2px solid var(--line);padding:3px 0 14px 20px;margin:15px 0}.commit small{display:block}code{font-size:12px;overflow-wrap:anywhere}@media(max-width:740px){main{grid-template-columns:1fr;gap:20px}header{padding:15px}h2{font-size:26px}}
</style>
<header><div><h1>Taskloom<span style="color:var(--accent)"> / </span>工作台</h1><small>把约定写清楚，让每次协作都有来处。</small></div><button id="logout" class="secondary" hidden>退出</button></header><div id="notice" role="status" aria-live="polite"></div>
<form id="login"><h2>进入工作台</h2><p class="muted">使用管理员为你签发的凭据。凭据仅用于本次登录。</p><label for="token">访问凭据</label><input id="token" type="password" autocomplete="off" required><button style="margin-top:20px">登录</button></form>
<main id="work" hidden><aside><div class="row"><h3>任务</h3><button id="refresh" class="secondary">刷新</button></div><nav id="tasks" aria-label="任务列表"></nav><details><summary>创建任务</summary><form id="create"><label>标题<input name="Title" required maxlength="200"></label><label>目标<textarea name="Goal"></textarea></label><label>验收标准<textarea name="Criteria"></textarea></label><button>创建</button></form></details></aside><section id="detail"><h2>选择一个任务</h2><p class="muted">或者先写下一个新的目标。</p></section>
</main>
<script>
const $=id=>document.getElementById(id);let selected='',cursor='',busy=false,pendingRefresh=false;const retryKeys=new Map();const prefix=location.pathname.replace(/\/app$/,'');
function notice(s){$('notice').textContent=s}async function api(path,method='GET',data,headers={}){let fingerprint=method+' '+path+' '+JSON.stringify(data),requestKey='';if(method!=='GET'){requestKey=retryKeys.get(fingerprint)||crypto.randomUUID();if(retryKeys.size>=256)retryKeys.delete(retryKeys.keys().next().value);retryKeys.set(fingerprint,requestKey)}let r=await fetch(prefix+path,{method,headers:{'Content-Type':'application/json','X-Taskloom-Request':'1',...(method==='GET'?{}:{'Idempotency-Key':requestKey}),...headers},...(data?{body:JSON.stringify(data)}:{})});if(!r.ok){if(r.status>=400&&r.status<500)retryKeys.delete(fingerprint);if(r.status===401){$('work').hidden=true;$('login').hidden=false;$('logout').hidden=true}let error=Error(await r.text());error.status=r.status;throw error}let result=await r.json();retryKeys.delete(fingerprint);return result}
function el(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function formdata(form){return Object.fromEntries(new FormData(form))}function handle(fn){return async e=>{e?.preventDefault();if(busy)return;busy=true;try{await fn(e);notice('')}catch(x){notice(x.message)}finally{busy=false}}}
async function start(){let p=await api('/changes');cursor=p.Cursor;await list();$('work').hidden=false;$('login').hidden=true;$('logout').hidden=false}
async function list(){let ts=await api('/tasks');$('tasks').replaceChildren();if(!ts.length)$('tasks').append(el('p','还没有可见任务','muted'));for(let d of ts){let b=el('button',d.Task.Title,d.Task.ID===selected?'selected':'');b.onclick=handle(async()=>{selected=d.Task.ID;await show();await list()});$('tasks').append(b)}if(selected&&!ts.some(d=>d.Task.ID===selected)){selected='';$('detail').replaceChildren(el('h2','任务访问权限已变更'))}}
async function show(){let d=await api('/tasks/'+encodeURIComponent(selected)),w=await api('/tasks/'+encodeURIComponent(selected)+'/workflow'),root=$('detail');root.replaceChildren(el('h2',d.Task.Title));root.append(el('span',w.Position.Status==='completed'?'已完成':w.Position.Status==='cancelled'?'已取消':({ready:'准备',executing:'执行中',accepting:'验收中',checkpoint:'待确认',factcheck:'检查中'})[w.Position.State]||w.Position.State,'badge'),el('small','依据 v'+d.Task.BasisVersion+' · 任务 v'+d.Task.Version),el('p',w.Position.Waiting||(w.Position.Status==='completed'?'结果与验收已满足，执行已安全退出':w.Position.Complete?'当前步骤已完成':''),'muted'),el('h3','目标'),el('p',d.Task.Goal||'待补充'),el('h3','验收标准'),el('p',d.Task.Criteria||'待补充'));if(d.CanEdit&&w.Position.Status==='active'&&(w.Position.State==='ready'||w.Position.State==='executing'&&(!w.Execution||w.Execution.RoundID!==w.Position.RoundID&&w.Execution.Safe))){let details=el('details'),summary=el('summary','修改任务约定'),f=el('form');details.append(summary,f);for(let name of ['Title','Goal','Criteria']){let label=el('label',({Title:'标题',Goal:'目标',Criteria:'验收标准'})[name]),input=el(name==='Title'?'input':'textarea');input.name=name;input.value=d.Task[name];label.append(input);f.append(label)}f.append(el('button','保存新依据'));f.onsubmit=handle(async()=>{await api('/tasks/'+selected,'PATCH',{...formdata(f),ExpectedVersion:d.Task.Version});await show();await list()});root.append(details)}if(d.CanEdit){let details=el('details'),f=el('form');details.append(el('summary','管理任务参与者'),f);let label=el('label','成员 ID'),input=el('input');input.name='Subject';input.required=true;label.append(input);f.append(label);let add=el('button','加入任务'),remove=el('button','移出任务','secondary');remove.type='button';f.append(add,remove);async function change(present){await api('/tasks/'+selected+'/participants','POST',{Subject:input.value,Present:present});notice(present?'参与者已加入':'参与者已移出')}f.onsubmit=handle(()=>change(true));remove.onclick=handle(()=>change(false));root.append(details)}await renderWorkflow(d,w,root);root.append(el('h3','Commit 时间线'));let cs=d.Commits||[];while(cs.length&&cs.length%100===0){let page=await api('/tasks/'+selected+'?after='+cs.at(-1).Sequence);if(!page.Commits.length)break;cs.push(...page.Commits);if(page.Commits.length<100)break}for(let c of cs){let box=el('article',undefined,'commit');box.append(el('small',c.Kind+' · '+c.Author+' · '+new Date(c.CreatedAt).toLocaleString()),el('p',c.Body),el('code',c.RefID?'更正引用 '+c.RefID:''));if(d.CanComment&&c.Kind==='comment'){let b=el('button','追加更正','secondary');b.onclick=()=>{let f=$('comment');f.elements.RefID.value=c.ID;f.elements.Body.focus();notice('更正将追加新记录，原内容保留。')};box.append(b)}root.append(box)}if(d.CanComment){let f=el('form');f.id='comment';let label=el('label','追加评论'),body=el('textarea');body.name='Body';body.required=true;label.append(body);let ref=el('input');ref.name='RefID';ref.type='hidden';f.append(label,ref,el('button','提交 commit'));f.onsubmit=handle(async()=>{await api('/tasks/'+selected+'/commits','POST',formdata(f));await show()});root.append(f)}}

async function renderWorkflow(d,w,root){
 const base={RoundID:w.Position.RoundID,BasisVersion:d.Task.BasisVersion,ExpectedRevision:w.Position.Revision};const ex=w.Execution;const ref=ex?{ExecutionID:ex.ID,Generation:ex.Generation}:{};const path='/tasks/'+encodeURIComponent(selected);
 const section=el('section');section.append(el('h3','执行与交付'));
 let live=el('p','执行者：'+(w.AssignedAgent||'待分配')+(ex?' · 第 '+ex.Generation+' 代 · '+ex.Status:''),'muted');live.id='execution-live-status';section.append(live);
 const actors={owner:'负责人',agent:'执行 Agent',reviewer:'验收人'};if(w.NextActor)section.append(el('p','下一步等待：'+actors[w.NextActor],'muted'));
 const actions={open:'认领执行',renew:'续期执行',submit:'提交结果',review:'验收'},reasons={task_not_active:'任务已结束或已取消',business_credential_required:'需要 Agent 业务凭据',not_assigned:'任务未分配给你',execution_in_progress:'本轮已有执行在进行',previous_execution_not_stopped:'上一次执行尚未确认安全停止',step_not_open:'当前步骤还不能执行（检查目标/标准或前置步骤）',not_your_execution:'当前执行不属于你的实例',execution_not_active:'执行已结束',execution_fenced:'执行已失效（取消或被替换）',round_changed:'任务已进入新一轮',basis_changed:'任务依据已更新，需要重新认领',lease_expired:'执行保活已过期，请先续期',not_reviewer:'你不是本任务验收人'};for(let [a,r] of Object.entries(w.Blocked||{}))section.append(el('p','暂不能'+(actions[a]||a)+'：'+(reasons[r]||r),'muted'));
 async function send(route,input){await api(path+route,'POST',input);await show();await list()}
 function button(text,fn){let b=el('button',text,'secondary');b.style.margin='4px';b.onclick=handle(fn);section.append(b)}
 if(w.CanManage&&w.Position.Status==='active'&&w.Position.State==='executing'&&w.SafeToExit){let f=el('form'),label=el('label','分配 Agent ID'),input=el('input');input.required=true;label.append(input);f.append(label,el('button','分配执行者'));f.onsubmit=handle(()=>send('/execution/assign',{...base,Subject:input.value}));section.append(f)}
 if(w.CanOpen)button('认领并开始执行',()=>send('/execution/open',base));
 if(w.CanRenew){button('续期执行',()=>send('/execution/renew',ref));button('报告主运行结束',()=>send('/execution/end',ref))}
 if(w.CanSubmit){let f=el('form'),label=el('label','明确提交结果'),body=el('textarea');body.required=true;label.append(body);f.append(label,el('button','提交结果'));f.onsubmit=handle(()=>send('/results',{...base,...ref,Body:body.value}));section.append(f)}
 if(w.Submission){let sub=w.Submission;section.append(el('p','当前结果：'+sub.ID+' · '+(w.Review?w.Review.Outcome:'此流程无需人工验收'),'muted'));let c=w.ResultCommit;if(c)section.append(el('p',c.Body));if(w.CanReview){let reason=el('input');reason.placeholder='验收意见（可选）';reason.setAttribute('aria-label','验收意见');section.append(reason);for(let [title,outcome] of [['验收通过','approved'],['验收不通过','rejected']])button(title,()=>send('/review',{...base,SubmissionID:sub.ID,CommitID:sub.CommitID,Outcome:outcome,Reason:reason.value}))}if(w.CanManage&&w.Position.Status==='active')button('撤回当前结果',()=>send('/withdraw',{...base,SubmissionID:sub.ID}))}
 if(w.Position.Status==='active'&&w.CanManage){button('取消任务',()=>send('/cancel',base));if(w.SafeToExit)button('退回并开始新轮',()=>send('/return',base))}
 if(w.Position.Status!=='active'&&w.CanManage&&w.SafeToExit)button('重开任务',()=>send('/reopen',base));
 if(ex&&!ex.Safe){section.append(el('p','停止证据尚未完整确认；执行结束或断线均不会自动解除等待。','muted'));if(w.CanIsolate){let details=el('details'),f=el('form');details.append(el('summary','管理员记录外部隔离证明'),f);let reasonLabel=el('label','隔离依据与原因'),reason=el('textarea');reason.required=true;reasonLabel.append(reason);let scopeLabel=el('label','已覆盖的执行及外部工作范围'),scope=el('textarea');scope.required=true;scopeLabel.append(scope);f.append(reasonLabel,scopeLabel,el('p','该操作记录管理员提供的隔离依据，不会声称工具已经停止。','muted'),el('button','记录隔离证明'));f.onsubmit=handle(()=>send('/execution/isolate',{...base,...ref,Reason:reason.value,Scope:scope.value}));section.append(details)}}
 root.append(section)
}
$('login').onsubmit=handle(async()=>{await api('/session','POST',null,{Authorization:'Bearer '+$('token').value});$('token').value='';await start()});$('create').onsubmit=handle(async()=>{let d=await api('/tasks','POST',formdata($('create')));selected=d.Task.ID;$('create').reset();await list();await show()});$('logout').onclick=handle(async()=>{await api('/session','DELETE');selected='';cursor='';$('work').hidden=true;$('login').hidden=false;$('logout').hidden=true});$('refresh').onclick=handle(async()=>{await start();if(selected)await show()});setInterval(async()=>{if(!cursor||busy||$('work').hidden)return;try{let p=await api('/changes?cursor='+encodeURIComponent(cursor));cursor=p.Cursor;pendingRefresh=pendingRefresh||p.Changes.length>0;let editing=document.activeElement?.matches('input,textarea,select');if(pendingRefresh&&!editing){await list();if(selected)await show();pendingRefresh=false}else if(selected){let state=await api('/tasks/'+encodeURIComponent(selected)+'/workflow'),live=$('execution-live-status');if(live)live.textContent='执行者：'+(state.AssignedAgent||'待分配')+(state.Execution?' · 第 '+state.Execution.Generation+' 代 · '+state.Execution.Status:'');if(pendingRefresh&&editing)notice('任务有新变化，已保留输入；完成编辑后刷新。')}}catch(e){cursor='';if(e.status===403){selected='';$('tasks').replaceChildren();$('detail').replaceChildren(el('h2','访问权限已变更'))}notice(e.message+'；请刷新同步。')}},4000);start().catch(()=>{});
</script></html>
