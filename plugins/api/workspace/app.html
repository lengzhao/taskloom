<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskloom · 任务工作台</title>
<style>
/* Tokens. CSP forbids external fonts or libraries, so everything stays inline. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2433; --muted: #667085; --line: #e4e7ec;
  --accent: #3b5bdb; --accent-soft: #edf2ff; --warn: #b54708; --warn-soft: #fffaeb;
  --ok: #067647; --ok-soft: #ecfdf3; --danger: #b42318; --danger-soft: #fef3f2;
  --radius: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --panel: #171a21; --ink: #e6e8ee; --muted: #98a2b3; --line: #2a2f3a;
    --accent: #7b93ff; --accent-soft: #1c2340; --warn: #fdb022; --warn-soft: #2b2112;
    --ok: #47cd89; --ok-soft: #11261c; --danger: #f97066; --danger-soft: #2c1513;
    --shadow: none;
  }
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif }
h1, h2, h3, h4 { margin: 0; line-height: 1.3 }
p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere }
button, input, textarea, select { font: inherit; color: inherit }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere }

/* Controls */
button { border: 1px solid var(--line); background: var(--panel); padding: 7px 14px; border-radius: 8px; cursor: pointer }
button:hover { border-color: var(--muted) }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff }
button.danger { color: var(--danger); border-color: var(--danger) }
button.link { border: 0; background: none; padding: 0; color: var(--accent) }
button:disabled { opacity: .45; cursor: default }
input, textarea, select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent) }
textarea { min-height: 84px; resize: vertical }
label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 13px }
form { margin: 0 }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }

/* Layout */
header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line) }
header h1 { font-size: 17px }
header h1 span { color: var(--accent) }
#notice { margin: 0 24px; padding: 0; min-height: 0 }
#notice:not(:empty) { margin-top: 12px; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn) }
#work { display: grid; grid-template-columns: 320px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 20px 24px }
aside, #detail { min-width: 0 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px }
.panel + .panel { margin-top: 14px }
.panel h3 { font-size: 14px; margin-bottom: 10px }
.muted { color: var(--muted) }
.small { font-size: 12px }

dialog { width: min(900px, 95vw); max-height: 90vh; overflow: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px }
dialog::backdrop { background: #0006 }
.member-row { border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap }
#members-content > section { margin-top: 20px }
/* Task list */
.tabs { display: flex; gap: 4px; padding: 3px; background: var(--bg); border-radius: 8px; margin-bottom: 10px }
.tabs button { flex: 1; border: 0; background: none; padding: 6px }
.tabs button.on { background: var(--panel); box-shadow: var(--shadow); font-weight: 600 }
.count { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 4px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px }
#tasks { display: flex; flex-direction: column; gap: 6px }
.task { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px }
.task.selected { border-color: var(--accent); background: var(--accent-soft) }
.task strong { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.task .meta { display: flex; gap: 6px; align-items: center; margin-top: 4px }

/* Pills */
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--bg); color: var(--muted); border: 1px solid var(--line) }
.pill.active { background: var(--accent-soft); color: var(--accent); border-color: transparent }
.pill.done { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.pill.stopped { background: var(--danger-soft); color: var(--danger); border-color: transparent }
.pill.mine { background: var(--warn-soft); color: var(--warn); border-color: transparent }
.pill.blocked { background: var(--bg); color: var(--warn); border-color: var(--warn) }
.pill.tag { background: var(--panel); color: var(--ink); border-color: var(--line) }
.pill.goal { background: var(--accent); color: #fff; border-color: transparent }
.tag-picker { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 8px }
.tag-picker label { display: inline-flex; gap: 4px; align-items: center; font-weight: normal }
.progress { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; margin: 8px 0 }
.progress > span { display: block; height: 100%; background: var(--ok) }
.goal-card { display: block; width: 100%; text-align: left; margin-bottom: 10px }
.tag-admin { display: grid; gap: 8px; margin: 8px 0 14px }
.tag-admin form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.tag-admin { margin-top: 18px }
.tag-admin form { flex-wrap: nowrap }
.tag-admin input { width: auto; min-width: 0; flex: 1 1 0 }
.tag-admin input[name=Name] { flex: 0 1 140px }
.tag-admin button { flex: none }

/* Detail */
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px }
.head h2 { font-size: 22px }
.head .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap }
.next { border-left: 4px solid var(--accent) }
.next.mine { border-left-color: var(--warn); background: var(--warn-soft) }
.next h3 { font-size: 15px }
.reasons { margin: 8px 0 0; padding-left: 18px; color: var(--muted) }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; margin-top: 14px; align-items: start }
.cols > div > .panel:first-child { margin-top: 0 }
.result { padding: 12px; border-radius: 8px; background: var(--bg); margin-top: 8px }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; overflow-wrap: anywhere }
details > summary { cursor: pointer; color: var(--accent); margin-top: 10px }
details[open] > summary { margin-bottom: 4px }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0 }
.timeline li { position: relative; padding: 0 0 14px 18px; border-left: 2px solid var(--line); margin-left: 4px }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--muted) }
.timeline li.result::before { border-color: var(--ok) }
.timeline .who { font-size: 12px; color: var(--muted) }
.timeline p { margin-top: 2px }
ul.attachments { list-style: none; margin: 4px 0 0; padding: 0 }
.timeline ul.attachments li { padding: 0; border: 0; margin: 2px 0 }
.timeline ul.attachments li::before { display: none }
ul.attachments a { word-break: break-all }
details.attach { margin: 6px 0 }
details.attach summary { cursor: pointer; color: var(--muted); font-size: 13px }
ul.attachments.chosen { margin: 4px 0 6px }
.attach-label { margin: 10px 0 4px; color: var(--muted); font-size: 13px }
ul.attachments.chosen li { margin: 2px 0 }

#login { max-width: 420px; margin: 80px auto }
.empty { padding: 40px 10px; text-align: center; color: var(--muted) }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr } }
@media (max-width: 760px) { #work { grid-template-columns: 1fr; padding: 12px } header { padding: 12px } }

#work {grid-template-columns:210px minmax(0,1fr);max-width:1600px}
#sidebar {position:sticky;top:16px;align-self:start}
#sidebar nav {display:grid;gap:5px;margin:18px 0}
#sidebar button {text-align:left;border:0;background:transparent}
#sidebar button.on {background:var(--accent-soft);color:var(--accent);font-weight:600}
#space-name {font-size:16px;overflow-wrap:anywhere}
#content {min-width:0}
.page-head {display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}
.toolbar {display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.skill-card {margin-bottom:10px}.skill-card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input {flex:1;min-width:150px}.toolbar select{width:auto;max-width:220px}
#tasks.board {display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));align-items:start;gap:12px}
.lane {background:var(--bg);border-radius:10px;padding:12px;display:grid;gap:8px}.lane h3{margin:0 0 6px}
.project-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.project-card {text-align:left;min-height:120px}.project-card strong{display:block;margin-bottom:8px}
#detail-back {margin-bottom:14px}
@media(max-width:760px){#work{grid-template-columns:1fr}#sidebar{position:static}#sidebar nav{display:flex;flex-wrap:wrap;margin:8px 0}header{flex-wrap:wrap;gap:8px}#tasks.board{grid-template-columns:1fr}.toolbar select{max-width:100%}}
</style>
</head>
<body>
<header>
  <h1>Taskloom <span>/</span> 工作台</h1>
  <div class="actions" style="margin:0"><button id="desktop-notify" hidden>开启桌面通知</button><button id="account-password" hidden>修改密码</button><button id="logout" hidden>退出</button></div>
</header>
<div id="notice" role="status" aria-live="polite"></div>

<section id="login" class="panel">
  <h2>登录 Taskloom</h2>
  <form id="password-login">
    <label>用户名<input id="username" autocomplete="username" required maxlength="128"></label>
    <label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <div class="actions"><button class="primary">登录</button></div>
  </form>
</section>

<main id="work" hidden>
 <aside id="sidebar" class="panel">
  <p class="muted small">工作空间</p><h2 id="space-name">当前空间</h2>
  <nav aria-label="工作台导航">
   <button id="tab-mine">等我处理<span id="mine-count" class="count" hidden></span></button>
   <button id="tab-goals">目标</button>
   <button id="tab-all">全部任务</button>
   <button id="tab-projects">项目</button>
   <button id="tab-skills" hidden>Skill</button>
   <button id="tab-space">空间设置</button>
  </nav>
  <p id="viewer-name" class="muted small"></p>
 </aside>
 <section id="content">
  <section id="browse" class="panel">
   <div class="page-head"><h2 id="page-title">全部任务</h2><button id="refresh">刷新</button></div>
   <div id="catalog-content"></div>
   <div id="task-area">
    <div class="toolbar">
     <input id="task-search" aria-label="搜索任务" placeholder="搜索标题、目标或任务编号">
     <select id="project-filter" aria-label="筛选项目"></select>
     <select id="level-filter" aria-label="筛选层级"><option value="">全部层级</option><option value="goal">目标</option><option value="top">顶层任务</option><option value="sub">子任务</option></select>
     <select id="tag-filter" aria-label="筛选标签"></select>
     <select id="owner-filter" aria-label="筛选负责人"></select>
     <select id="assignee-filter" aria-label="筛选处理人"></select>
     <select id="status-filter" aria-label="筛选状态"><option value="">全部状态</option><option value="unassigned">待分配</option><option value="handling">处理中</option><option value="blocked">已阻塞</option><option value="accepting">验收中</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select>
     <select id="task-layout" aria-label="任务视图"><option value="list">列表</option><option value="board">看板</option></select>
    </div>
    <details id="create-box"><summary>+ 新建任务</summary>
     <form id="create">
      <label>标题<input name="Title" required maxlength="200"></label>
      <label>所属项目<select name="ProjectID" id="create-project"></select></label>
      <label>目标（分配前必填）<textarea name="Goal" placeholder="要达成什么"></textarea></label>
      <label>验收标准（可选）<textarea name="Criteria" placeholder="怎样算完成；不填则由负责人验收时判断"></textarea></label>
      <label>验收方式<select name="Acceptance" id="create-acceptance"></select></label>
      <label>处理人（可选）<select name="Assignee" id="create-assignee"></select></label>
      <div><span class="small">标签（可选）</span><div id="create-tags"></div></div>
      <p class="muted small">可以先只写标题记下来，分配处理人前再补全目标；创建时就选处理人则目标必填。</p>
      <div class="actions"><button class="primary">创建</button></div>
     </form>
    </details>
    <nav id="tasks" aria-label="任务列表" style="margin-top:18px"></nav>
   </div>
  </section>
  <section id="detail-shell" hidden><button id="detail-back">← 返回列表</button><section id="detail"></section></section>
 </section>
</main>
<dialog id="project-dialog" aria-labelledby="project-title">
 <div class="page-head"><h2 id="project-title">新建项目</h2><button id="project-close" type="button">关闭</button></div>
 <p id="project-notice" role="status"></p>
 <form id="project-form">
  <label>项目名称<input id="project-name" required maxlength="200"></label>
  <label>项目目标与说明<textarea id="project-description" maxlength="20000"></textarea></label>
  <label>项目负责人<select id="project-owner" required></select></label>
  <fieldset id="project-members-box" style="border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px"><legend class="small">项目成员（可读项目内全部任务并留言、提问；可以是用户或 Agent）</legend><div id="project-members"></div></fieldset>
  <div class="actions"><button class="primary">保存项目</button></div>
 </form>
</dialog>
<dialog id="password-dialog" aria-labelledby="password-title">
 <div class="head"><h2 id="password-title">修改密码</h2><button id="password-close" type="button">关闭</button></div>
 <p id="password-notice" role="status" style="color:var(--warn)"></p>
 <form id="change-password">
  <label id="current-password-field">当前密码<input id="current-password" type="password" autocomplete="current-password" maxlength="128"></label>
  <label>新密码<input id="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="8–128 位"></label>
  <label>确认新密码<input id="confirm-password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
  <p class="muted small">保存后，该用户已登录的会话全部失效，需要用新密码重新登录；已签发的凭据继续有效，怀疑泄露请撤销对应凭据。</p>
  <div class="actions"><button class="primary">保存密码</button></div>
 </form>
</dialog>
<dialog id="members-dialog" aria-labelledby="members-title">
 <div class="head"><h2 id="members-title">用户与 Agent</h2><button id="members-close" type="button">关闭</button></div>
 <p id="members-notice" role="status" style="color:var(--warn);margin-top:10px"></p>
 <div id="members-content"></div>
</dialog>
<script>
// ---------- Labels (display only; flow rules stay on the server) ----------
// One vocabulary everywhere: list, board, filter and detail. "Blocked" is a tag, not a state.
const STATES = [['unassigned', '待分配'], ['handling', '处理中'], ['accepting', '验收中'], ['completed', '已完成'], ['cancelled', '已取消']];
const ACTOR_LABEL = { owner: '负责人', assignee: '处理人', reviewer: '验收人', addressee: '被提问人' };
const execLabel = (ex, pos) => pos && pos.Status !== 'active' ? '任务已结束' : ex.Writable ? '进行中' : '已停止（被取消或转交）';
const OUTCOME_LABEL = { pending: '待验收', approved: '已通过', rejected: '未通过' };
// Acceptance is fixed when a task is created: manual waits for the owner's
// verdict, none completes on a submitted result.
const ACCEPTANCE_LABEL = { manual: '需负责人验收', none: '免验收：提交结果即完成' };
const KIND_LABEL = { 'task.owner': '移交负责人', comment: '留言', result: '结果', question: '提问', answer: '回答', 'review.approved': '验收通过', 'review.rejected': '验收退回', 'task.created': '创建任务', 'task.basis': '修改要求', 'plan.changed': '调整子任务', 'question.closed': '关闭问题' };

// ---------- State ----------
const $ = id => document.getElementById(id);
const prefix = location.pathname.replace(/\/app$/, '');
const retryKeys = new Map();
let selected = '', cursor = '', busy = false, pendingRefresh = false, view = 'mine';
const pendingIDs = new Set(); // changed tasks not yet re-read
let inboxIDs = new Set(); // tasks currently waiting on the signed-in user
let blockedMine = new Set(); // the user's own tasks waiting on required subtasks
let expandBasis = ''; // a task created incomplete keeps its agreement editor open

// ---------- Helpers ----------
function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text !== undefined && text !== null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}
function h(tag, cls, ...children) {
  const n = el(tag, undefined, cls);
  for (const c of children) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
function notice(s) { $('project-notice').textContent=$('project-dialog').open?s:''; $('notice').textContent = s; $('members-notice').textContent = $('members-dialog').open ? s : ''; $('password-notice').textContent = $('password-dialog').open ? s : '' }
function formdata(form) { return Object.fromEntries(new FormData(form)) }
function handle(fn) {
  return async e => {
    e?.preventDefault();
    if (busy) return;
    busy = true;
    try { notice(''); await fn(e) } catch (x) { notice(x.message) } finally { busy = false }
  };
}
function button(text, fn, cls = '') {
  const b = el('button', text, cls);
  b.type = 'button';
  b.onclick = handle(fn);
  return b;
}
function field(labelText, input) { const l = el('label', labelText); l.append(input); return l }
function textarea(name, required, placeholder) {
  const t = el('textarea'); t.name = name; t.required = !!required; if (placeholder) t.placeholder = placeholder; return t;
}
function time(v) { return v ? new Date(v).toLocaleString() : '' }
function ago(v) {
  const m = Math.max(0, Math.round((Date.now() - new Date(v)) / 60000));
  return m < 1 ? '刚刚' : m < 60 ? m + ' 分钟前' : m < 1440 ? Math.round(m / 60) + ' 小时前' : Math.round(m / 1440) + ' 天前';
}

// Writes reuse the same Idempotency-Key until a definite answer arrives.
async function api(path, method = 'GET', data, headers = {}) {
  const fingerprint = method + ' ' + path + ' ' + JSON.stringify(data);
  let requestKey = '';
  if (method !== 'GET') {
    requestKey = retryKeys.get(fingerprint) || crypto.randomUUID();
    if (retryKeys.size >= 256) retryKeys.delete(retryKeys.keys().next().value);
    retryKeys.set(fingerprint, requestKey);
  }
  const r = await fetch(prefix + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Taskloom-Request': '1', ...(method === 'GET' ? {} : { 'Idempotency-Key': requestKey }), ...headers },
    ...(data ? { body: JSON.stringify(data) } : {}),
  });
  const out = await answer(r, fingerprint);
  if (method !== 'GET') wrote(path, out);
  return out;
}
// allTasks reads the task list in bounded pages: the server returns the next
// page's cursor in X-Next-Cursor, so no single request derives every task.
async function allTasks(query = '') {
  let out = [], next = '';
  do {
    const path = '/tasks?limit=200' + query + (next ? '&cursor=' + encodeURIComponent(next) : '');
    const r = await fetch(prefix + path, { headers: { 'X-Taskloom-Request': '1' } });
    next = r.ok ? (r.headers.get('X-Next-Cursor') || '') : '';
    out = out.concat(await answer(r, 'GET ' + path));
  } while (next);
  return out;
}
// upload sends one file's raw bytes; the same file keeps its key until answered.
async function upload(path, file) {
  const fingerprint = 'upload ' + path + ' ' + file.name + ' ' + file.size + ' ' + file.lastModified;
  const requestKey = retryKeys.get(fingerprint) || crypto.randomUUID();
  retryKeys.set(fingerprint, requestKey);
  const r = await fetch(prefix + path + '/files?name=' + encodeURIComponent(file.name), {
    method: 'POST',
    headers: { 'Content-Type': file.type || 'application/octet-stream', 'X-Taskloom-Request': '1', 'Idempotency-Key': requestKey },
    body: file,
  });
  return answer(r, fingerprint);
}
async function answer(r, fingerprint) {
  if (!r.ok) {
    if (r.status >= 400 && r.status < 500) retryKeys.delete(fingerprint);
    if (r.status === 401) showLogin();
    const raw = await r.text();
    let p = null;
    try { p = JSON.parse(raw) } catch {}
    const error = Error(p?.Message ? p.Message + (p.Field ? '（' + p.Field + '）' : '') : raw || '请求失败');
    error.status = r.status; error.code = p?.Code;
    throw error;
  }
  // 204: the write succeeded but the caller can no longer read the task.
  const result = r.status === 204 ? null : await r.json();
  retryKeys.delete(fingerprint);
  return result;
}

// ---------- Status presentation ----------
// stateOf names a task's state for display only; flow rules stay on the server.
// An active task is 验收中 when a result awaits acceptance, else 处理中 once
// someone handles it, else 待分配.
function stateOf(position, assignee) {
  const key = position.Status !== 'active' ? position.Status
    : position.State === 'accepting' ? 'accepting' : assignee ? 'handling' : 'unassigned';
  const cls = { completed: 'done', cancelled: 'stopped' }[key] || 'active';
  return { key, text: Object.fromEntries(STATES)[key], cls };
}

// Nothing is stored for this: the inbox is derived on the server, and a task
// that enters it between two reads is new. Tasks this page itself just wrote
// to are skipped on the next read of them, so nobody is told about their own move.

const ARRIVAL_LABEL = { owner: '等你安排', assignee: '分配给你处理', reviewer: '等你验收', addressee: '有人向你提问' };
function wrote(path, out) {
  const m = path.match(/^\/tasks\/([^/?]+)/);

function arrivals(before, read) {
  const covered = id => !read || read.includes(id);

  for (const id of own) ownWrites.delete(id);
  if (!inboxSeen) { inboxSeen = true; return }
  const fresh = [];
  for (const [id, actor] of inboxMap) {
    if (before.get(id) === actor || own.has(id) || (id === selected && !document.hidden)) continue;
    freshIDs.add(id); fresh.push([id, actor]);
  }
  for (const id of freshIDs) if (!inboxMap.has(id)) freshIDs.delete(id);
  if (!fresh.length) return;
  const title = id => taskCache.find(d => d.Task.ID === id)?.Task.Title || '任务 ' + id;
  notice('新的待处理：' + fresh.map(([id, a]) => '「' + title(id) + '」' + (ARRIVAL_LABEL[a] || '')).join('，'));
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  for (const [id, a] of fresh.slice(0, 3)) {
    const n = new Notification('Taskloom · ' + (ARRIVAL_LABEL[a] || '等你处理'), { body: title(id), tag: 'taskloom-' + id + '-' + a });

  }

const TRUST_LABEL = { approved: '已通过审核', rejected: '已拒绝', unreviewed: '待审核' };
let skillTrust = '', skillSearch = '', skillsView = null;

async function renderSkills(root) {

// ---------- Task detail ----------
// current is the shown task's view; earlier holds older timeline pages the
// user asked for, kept while the same task stays open.
let current = null, earlier = { id: '', commits: [], more: false }, people = null;
async function show(view) {
  freshIDs.delete(selected);
  const path = '/tasks/' + encodeURIComponent(selected);
  const [d, files] = await Promise.all([view ? view : api(path), api(path + '/files')]);
  if (earlier.id !== selected) earlier = { id: selected, commits: [], more: !!d.Earlier };
  current = { d, files };
  paint();
}
// paint renders the current view without reading anything.
function paint() {
  const { d, files } = current;
  const w = d; // the task view carries the snapshot fields too
  const path = '/tasks/' + encodeURIComponent(d.Task.ID);
  const seen = new Set(d.Commits.map(c => c.ID));
  const commits = earlier.commits.filter(c => !seen.has(c.ID)).concat(d.Commits);
  const ctx = makeContext(d, w, path);
  // Selectors for assignee, participant and addressee; any active task may ask any member.
  ctx.candidates = people || [];
  ctx.commits = new Map(commits.map(c => [c.ID, c]));
  ctx.files = new Map(files.map(f => [f.ID, f]));
  ctx.more = earlier.commits.length ? earlier.more : !!d.Earlier;
  $('detail').replaceChildren(
    renderHead(ctx),
    renderNext(ctx),
    h('div', 'cols',
      h('div', null, renderResult(ctx), renderTimeline(ctx, commits)),
      h('div', null, renderBasis(ctx), renderPlan(ctx), renderExecution(ctx), renderAsk(ctx), renderParticipants(ctx), renderManage(ctx))));
}
// older loads the timeline page before the oldest one shown.
async function older() {
  const oldest = (earlier.commits[0] || current.d.Commits[0]);
  const page = await api('/tasks/' + encodeURIComponent(selected) + '?before=' + oldest.Sequence);
  earlier = { id: selected, commits: page.Commits.concat(earlier.commits), more: !!page.Earlier };
  paint();
}
// settle shows what a task write returned: that task's list row is re-read,
// the detail renders from the answer. 204 means the task left the caller's view.
async function settle(view, id = selected) {
  await refresh([id]);
  if (!view) { if (id === selected) { selected = ''; render() } notice('该任务已不在你的可见范围内'); return }
  if (view.Task.ID !== selected) { selected = view.Task.ID; render() }
  await show(view);
}

function makeContext(d, w, path) {
  const ex = w.Execution;
  const active = w.Position.Status === 'active';
  return {
    d, w, ex, active, path,
    // Each command pins only what it needs: the basis to claim, the round to reopen.
    claim: { BasisVersion: d.Task.BasisVersion },
    round: { RoundID: w.Position.RoundID },
    ref: ex ? { ExecutionID: ex.ID } : {},
    // The answer is the task's current view; only its list row is re-read.
    async send(route, input) { await settle(await api(path + route, 'POST', input)) },
  };
}

function renderNext(ctx) {
  const { d, w, active, claim, round } = ctx;

  const s = stateOf(w.Position, w.Assignee);
  let title;
  if (w.Position.Status === 'completed') title = w.Position.Acceptance === 'none' ? '已完成：结果已提交（免验收），需要返工请新建任务' : '已完成：结果与验收已满足，需要返工请新建任务';
  else if (w.Position.WaitingOnSubtasks && !w.NextActor) {
    // Blocked is a wait cause, not a step: the work is still this task's, only delivery waits.
    const kids = (w.Children || []).filter(c => c.Required);
    const done = kids.filter(c => c.Status === 'completed').length;
    title = '阻塞：等待必需子任务完成' + (kids.length ? `（可见 ${done}/${kids.length}）` : '');
  }

  // The worker otherwise only sees the submit form vanish, e.g. while a question is open and the title names the addressee.
  // A claim is the next move when one is open; the old execution's submit block is moot then.
  if (active && !w.CanOpen && w.Blocked?.submit) panel.append(el('p', '暂不能提交结果：' + w.Blocked.submit.Message, 'muted'));

  renderQuestions(ctx, panel);
  // Only people sign in here; Agents work through the API.

  }

    const reason = el('input');

    reason.setAttribute('aria-label', '验收意见');

      if (outcome === 'rejected' && !reason.value.trim()) { reason.focus(); throw Error('验收不通过时请写明需要修改的地方') }
      return ctx.send('/review', { CommitID: res.CommitID, Outcome: outcome, Reason: reason.value });
    };
    // When the owner handled the task themself there is no second person checking: it is a confirmation.
    const own = w.Assignee === d.Task.Owner;
    panel.append(h('div', null, el('label', own ? '确认自己的结果' : '验收当前结果'), reason));

  return panel;
}

// attachInputs picks files to upload and links to attach. The chosen files are

// failed is reused, not uploaded again, even if it was picked again.

let fileLimits = null;
async function limits() { return fileLimits ||= await api('/files/limits') }
function attachInputs() {

  const fileKey = f => f.name + '\n' + f.size + '\n' + f.lastModified;

      const x = el('button', '移除', 'link small'); x.type = 'button';
      x.onclick = () => { chosen.delete(k); render() };
      return h('li', null, '📎 ' + f.name + ' ', el('span', size(f.size) + ' ', 'muted small'), x);
    }));
    count.textContent = (chosen.size ? ' 已选 ' + chosen.size + ' 个' : '') + (fileLimits ? '（最多 ' + fileLimits.MaxFiles + ' 个，单个不超过 ' + size(fileLimits.MaxBytes) + '）' : '');

  render();

  links.style.minHeight = '44px';

  const node = h('details', 'attach', el('summary', '附件与链接'), h('div', 'attach-files', el('div', '文件', 'attach-label'), files), field('链接', links));
  return {
    node,
    // collect returns the Files and Links to send with body, uploading files
    // first; it refuses an invalid or empty send before any upload.
    async collect(path, body) {
      const out = {};
      const lim = await limits();
      const ls = [];
      for (const line of links.value.split('\n').map(x => x.trim()).filter(Boolean)) {
        const i = line.search(/\s/);
        const l = i < 0 ? { URL: line } : { URL: line.slice(0, i), Title: line.slice(i).trim() };
        let u = null;

        if (!u || !/^https?:$/.test(u.protocol) || u.username || u.password || l.URL.length > 2048)
          throw Error('链接格式不对：' + l.URL + '（需以 http:// 或 https:// 开头）');
        if ((l.Title || '').length > 200) throw Error('链接标题太长（最多 200 字）：' + l.Title.slice(0, 20) + '…');
        ls.push(l);
      }
      if (ls.length > lim.MaxLinks) throw Error('链接最多 ' + lim.MaxLinks + ' 个，当前 ' + ls.length + ' 个');
      if (chosen.size > lim.MaxFiles) throw Error('文件最多 ' + lim.MaxFiles + ' 个，当前 ' + chosen.size + ' 个');
      const empty = [...chosen.values()].filter(f => f.size === 0).map(f => f.name);
      if (empty.length) throw Error('空文件不能作为附件：' + empty.join('、'));
      const big = [...chosen.values()].filter(f => f.size > lim.MaxBytes).map(f => f.name + '（' + size(f.size) + '）');
      if (big.length) throw Error('超过单个文件上限 ' + size(lim.MaxBytes) + '：' + big.join('、'));
      if (!body.trim() && !chosen.size && !ls.length) throw Error('请填写内容，或附上文件、链接');
      const ids = [];
      let n = 0;
      for (const [k, file] of chosen) {
        n++;
        if (!uploaded.has(k)) {
          notice('正在上传 ' + file.name + '（' + n + '/' + chosen.size + '）…');
          try { uploaded.set(k, (await upload(path, file)).ID) }
          catch (e) { throw Error('「' + file.name + '」上传失败：' + (e.status === 413 ? '超过文件大小上限' : e.message.trim())) }
        }
        ids.push(uploaded.get(k));
      }
      notice('');
      if (ids.length) out.Files = ids;
      if (ls.length) out.Links = ls;
      return out;
    },
  };
}

// folded shows a long result in the timeline as its first lines; the full text

// planText turns a plan.changed body into words; titles come only from subtasks this viewer can read.
function planText(c, d, w) {
  let v;
  try { v = JSON.parse(c.Body) } catch { return c.Body }

        h('div','actions',button('复制凭据',async()=>{await navigator.clipboard.writeText(issued.Secret);notice('凭据已复制')}),button('下载凭据文件',download)));
    }
    result.append(el('p','凭据编号：'+issued.ID,'muted small'),button('撤销本次凭据',async()=>{await api('/admin/credentials/revoke','POST',{CredentialID:issued.ID});result.replaceChildren(el('p','凭据已撤销'))},'danger'));
  });
  if(active.length) root.append(h('section',null,credentialForm));
  // Audit trail: every committed or rejected command, newest first.
  const trail=h('div',null);
  root.append(h('section',null,el('h3','审计记录'),h('div','actions',button('查看最近 100 条',async()=>{
    const items=await api('/admin/audit?limit=100');
    trail.replaceChildren(...(items.length?items.map(a=>el('p',time(a.At)+' · '+a.Subject+' · '+a.Operation+' · '+a.Resource+' · '+(a.Outcome==='committed'?'成功':'被拒绝')+(a.Reason?' · '+a.Reason:''),'muted small')):[el('p','暂无记录','muted')]));
  })),trail));
  if(preselect) credentialForm.scrollIntoView({block:'center'});
}

// ---------- Password account flow ----------
let passwordTarget=null;
function openPassword(target=null){
  passwordTarget=target;$('change-password').reset();$('password-notice').textContent='';
  const needsCurrent=!target;
  $('current-password-field').hidden=!needsCurrent;$('current-password').required=needsCurrent;
  $('password-title').textContent=target?'为 '+target+' 设置密码':'修改登录密码';
  if(!$('password-dialog').open)$('password-dialog').showModal();
}
$('account-password').onclick=()=>openPassword();
$('password-close').onclick=()=>{$('change-password').reset();$('password-dialog').close()};
$('password-dialog').addEventListener('close',()=>{$('change-password').reset()});
$('password-dialog').addEventListener('cancel',()=>{$('change-password').reset()});
$('change-password').onsubmit=handle(async()=>{
  if($('new-password').value!==$('confirm-password').value)throw Error('两次输入的密码不一致');
  const subject=viewer.Subject, target=passwordTarget;
  const body={Password:$('new-password').value};
  if(!target)body.CurrentPassword=$('current-password').value;
  await api(target?'/admin/users/'+encodeURIComponent(target)+'/password':'/account/password','POST',body);
  $('change-password').reset();$('password-dialog').close();
  if(!target || target===subject){await api('/session','DELETE');showLogin();$('username').value=subject;notice('密码已设置，请用用户名和新密码登录。')}
  else notice('用户密码已更新，旧会话已失效，已签发的凭据不受影响。');
});
$('password-login').onsubmit=handle(async()=>{
  try{await api('/session','POST',{Username:$('username').value.trim(),Password:$('password').value});await start()}
  finally{$('password').value=''}
});

// ---------- Wiring ----------
acceptanceOptions($('create-acceptance'));
$('create-box').addEventListener('toggle', () => { if ($('create-box').open) directory().then(m => assigneeOptions($('create-assignee'), m)).catch(x => notice(x.message)) });
$('create').onsubmit = handle(async () => {
  const v = formdata($('create'));
  checkCreate(v, $('create').elements.Goal);
  const d = await api('/tasks', 'POST', { ...v, Tags: createTags ? createTags.value() : [] });
  $('create').reset();
  $('create-box').open = false;
  if(view!=='project') view = 'all';
  await settle(d, d.Task.ID);
  openBasisIfIncomplete(d.Task);
});

// A task saved with only a title opens its requirements editor right away, so it gets a goal before assignment.
function openBasisIfIncomplete(t) {
  if (t.Goal.trim()) return;
  expandBasis = t.ID;
  const d = [...document.querySelectorAll('#detail details')].find(x => x.querySelector('summary')?.textContent === '修改要求');
  if (d) { d.open = true; d.scrollIntoView({ block: 'center' }); }
}
$('logout').onclick = handle(async () => {
  await api('/session', 'DELETE');
  showLogin();
});
$('refresh').onclick = handle(async () => { await list(); if (selected) await show() });



// Poll the authorized change feed; never overwrite a form the user is editing.
setInterval(async () => {
  if (!cursor || busy || $('work').hidden) return;
  try {
    const p = await api('/changes?cursor=' + encodeURIComponent(cursor));
    cursor = p.Cursor;
    // A task change re-reads that task only; membership, space or project
    // changes (access.changed) re-read everything.
    for (const c of p.Changes) {
      if (c.Kind === 'task.changed' && c.TaskID) pendingIDs.add(c.TaskID); else pendingRefresh = true;
    }
    const due = pendingRefresh || pendingIDs.size > 0;
    const editing = document.activeElement?.matches('input,textarea,select') || (view==='space') || $('create-box').open;
    if (due && !editing && !document.querySelector('dialog[open]')) {
      const all = pendingRefresh || pendingIDs.size > 100, open = selected && (pendingRefresh || pendingIDs.has(selected));
      if (pendingRefresh) people = null;
      if (all) await Promise.all([list(), directory()]); else await refresh([...pendingIDs]);
      if (open && selected) await show();
      pendingRefresh = false; pendingIDs.clear();
    } else if (due && editing) notice('任务有新变化，已保留你的输入；完成编辑后刷新。');
  } catch (e) {
    // Events older than the retained range are gone: start over from a fresh
    // cursor and full lists instead of guessing what was missed.
    if (e.code === 'resync_required') {
      try {
        cursor = (await api('/changes')).Cursor; people = null; pendingRefresh = false; pendingIDs.clear();
        await Promise.all([list(), directory()]);
        if (selected) await show();
        notice('已重新同步任务列表');
      } catch (e2) { cursor = ''; notice(e2.message + '；请刷新同步。') }
      return;
    }
    cursor = '';
    if (e.status === 403) {
      selected = '';
      $('tasks').replaceChildren();
      $('detail').replaceChildren(h('div', 'panel empty', '访问权限已变更'));
    }
    notice(e.message + '；请刷新同步。');
  }
}, 4000);

start().catch(() => {});
