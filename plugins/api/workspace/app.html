<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskloom · 任务工作台</title>
<style>
/* Tokens. CSP forbids external fonts or libraries, so everything stays inline. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2433; --muted: #667085; --line: #e4e7ec;
  --accent: #3b5bdb; --accent-soft: #edf2ff; --warn: #b54708; --warn-soft: #fffaeb;
  --ok: #067647; --ok-soft: #ecfdf3; --danger: #b42318; --danger-soft: #fef3f2;
  --radius: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --panel: #171a21; --ink: #e6e8ee; --muted: #98a2b3; --line: #2a2f3a;
    --accent: #7b93ff; --accent-soft: #1c2340; --warn: #fdb022; --warn-soft: #2b2112;
    --ok: #47cd89; --ok-soft: #11261c; --danger: #f97066; --danger-soft: #2c1513;
    --shadow: none;
  }
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif }
h1, h2, h3, h4 { margin: 0; line-height: 1.3 }
p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere }
button, input, textarea, select { font: inherit; color: inherit }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere }

/* Controls */
button { border: 1px solid var(--line); background: var(--panel); padding: 7px 14px; border-radius: 8px; cursor: pointer }
button:hover { border-color: var(--muted) }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff }
button.danger { color: var(--danger); border-color: var(--danger) }
button.link { border: 0; background: none; padding: 0; color: var(--accent) }
button:disabled { opacity: .45; cursor: default }
input, textarea, select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent) }
textarea { min-height: 84px; resize: vertical }
label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 13px }
form { margin: 0 }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }

/* Layout */
header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line) }
header h1 { font-size: 17px }
header h1 span { color: var(--accent) }
#notice { margin: 0 24px; padding: 0; min-height: 0 }
#notice:not(:empty) { margin-top: 12px; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn) }
#work { display: grid; grid-template-columns: 320px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 20px 24px }
aside, #detail { min-width: 0 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px }
.panel + .panel { margin-top: 14px }
.panel h3 { font-size: 14px; margin-bottom: 10px }
.muted { color: var(--muted) }
.small { font-size: 12px }

dialog { width: min(900px, 95vw); max-height: 90vh; overflow: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px }
dialog::backdrop { background: #0006 }
.member-row { border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap }
#members-content > section { margin-top: 20px }
/* Task list */
.tabs { display: flex; gap: 4px; padding: 3px; background: var(--bg); border-radius: 8px; margin-bottom: 10px }
.tabs button { flex: 1; border: 0; background: none; padding: 6px }
.tabs button.on { background: var(--panel); box-shadow: var(--shadow); font-weight: 600 }
.count { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 4px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px }
#tasks { display: flex; flex-direction: column; gap: 6px }
.task { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px }
.task.selected { border-color: var(--accent); background: var(--accent-soft) }
.task strong { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.task .meta { display: flex; gap: 6px; align-items: center; margin-top: 4px }

/* Pills */
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--bg); color: var(--muted); border: 1px solid var(--line) }
.pill.active { background: var(--accent-soft); color: var(--accent); border-color: transparent }
.pill.done { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.pill.stopped { background: var(--danger-soft); color: var(--danger); border-color: transparent }
.pill.mine { background: var(--warn-soft); color: var(--warn); border-color: transparent }

/* Detail */
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px }
.head h2 { font-size: 22px }
.head .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap }
.next { border-left: 4px solid var(--accent) }
.next.mine { border-left-color: var(--warn); background: var(--warn-soft) }
.next h3 { font-size: 15px }
.reasons { margin: 8px 0 0; padding-left: 18px; color: var(--muted) }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; margin-top: 14px; align-items: start }
.cols > div > .panel:first-child { margin-top: 0 }
.result { padding: 12px; border-radius: 8px; background: var(--bg); margin-top: 8px }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; overflow-wrap: anywhere }
details > summary { cursor: pointer; color: var(--accent); margin-top: 10px }
details[open] > summary { margin-bottom: 4px }
.debug { border-style: dashed }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0 }
.timeline li { position: relative; padding: 0 0 14px 18px; border-left: 2px solid var(--line); margin-left: 4px }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--muted) }
.timeline li.result::before { border-color: var(--ok) }
.timeline .who { font-size: 12px; color: var(--muted) }
.timeline p { margin-top: 2px }

#login { max-width: 420px; margin: 80px auto }
.empty { padding: 40px 10px; text-align: center; color: var(--muted) }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr } }
@media (max-width: 760px) { #work { grid-template-columns: 1fr; padding: 12px } header { padding: 12px } }

#work {grid-template-columns:210px minmax(0,1fr);max-width:1600px}
#sidebar {position:sticky;top:16px;align-self:start}
#sidebar nav {display:grid;gap:5px;margin:18px 0}
#sidebar button {text-align:left;border:0;background:transparent}
#sidebar button.on {background:var(--accent-soft);color:var(--accent);font-weight:600}
#space-name {font-size:16px;overflow-wrap:anywhere}
#content {min-width:0}
.page-head {display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}
.toolbar {display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.toolbar input {flex:1;min-width:150px}.toolbar select{width:auto;max-width:220px}
#tasks.board {display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));align-items:start;gap:12px}
.lane {background:var(--bg);border-radius:10px;padding:12px;display:grid;gap:8px}.lane h3{margin:0 0 6px}
.project-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.project-card {text-align:left;min-height:120px}.project-card strong{display:block;margin-bottom:8px}
#detail-back {margin-bottom:14px}
@media(max-width:760px){#work{grid-template-columns:1fr}#sidebar{position:static}#sidebar nav{display:flex;flex-wrap:wrap;margin:8px 0}header{flex-wrap:wrap;gap:8px}#tasks.board{grid-template-columns:1fr}.toolbar select{max-width:100%}}
</style>
</head>
<body>
<header>
  <h1>Taskloom <span>/</span> 工作台</h1>
  <div class="actions" style="margin:0"><button id="account-password" hidden>修改密码</button><button id="logout" hidden>退出</button></div>
</header>
<div id="notice" role="status" aria-live="polite"></div>

<section id="login" class="panel">
  <h2>登录 Taskloom</h2>
  <form id="password-login">
    <label>用户名<input id="username" autocomplete="username" required maxlength="128"></label>
    <label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <div class="actions"><button class="primary">登录</button></div>
  </form>
  <details id="credential-login-box">
    <summary>Agent 接入 / 已有管理员首次设置密码</summary>
    <form id="credential-login">
      <p class="muted small">普通用户请使用用户名和密码。首次迁移的管理员可用原凭据登录后设置密码。</p>
      <label for="token">接入凭据</label><input id="token" type="password" autocomplete="off" required>
      <div class="actions"><button>凭据登录</button></div>
    </form>
  </details>
</section>

<main id="work" hidden>
 <aside id="sidebar" class="panel">
  <p class="muted small">工作空间</p><h2 id="space-name">当前空间</h2>
  <nav aria-label="工作台导航">
   <button id="tab-mine">等我处理<span id="mine-count" class="count" hidden></span></button>
   <button id="tab-all">全部任务</button>
   <button id="tab-projects">项目</button>
   <button id="tab-space">空间设置</button>
  </nav>
  <p id="viewer-name" class="muted small"></p>
 </aside>
 <section id="content">
  <section id="browse" class="panel">
   <div class="page-head"><h2 id="page-title">全部任务</h2><button id="refresh">刷新</button></div>
   <div id="catalog-content"></div>
   <div id="task-area">
    <div class="toolbar">
     <input id="task-search" aria-label="搜索任务" placeholder="搜索标题、目标或任务编号">
     <select id="project-filter" aria-label="筛选项目"></select>
     <select id="status-filter" aria-label="筛选阶段"><option value="">全部阶段</option><option value="ready">待处理</option><option value="executing">处理中</option><option value="accepting">待验收</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select>
     <select id="task-layout" aria-label="任务视图"><option value="list">列表</option><option value="board">看板</option></select>
    </div>
    <details id="create-box"><summary>+ 新建任务</summary>
     <form id="create">
      <label>标题<input name="Title" required maxlength="200"></label>
      <label>所属项目<select name="ProjectID" id="create-project"></select></label>
      <label>目标<textarea name="Goal" placeholder="要达成什么"></textarea></label>
      <label>验收标准<textarea name="Criteria" placeholder="怎样算完成"></textarea></label>
      <div class="actions"><button class="primary">创建</button></div>
     </form>
    </details>
    <nav id="tasks" aria-label="任务列表" style="margin-top:18px"></nav>
   </div>
  </section>
  <section id="detail-shell" hidden><button id="detail-back">← 返回列表</button><section id="detail"></section></section>
 </section>
</main>
<dialog id="project-dialog" aria-labelledby="project-title">
 <div class="page-head"><h2 id="project-title">新建项目</h2><button id="project-close" type="button">关闭</button></div>
 <p id="project-notice" role="status"></p>
 <form id="project-form">
  <label>项目名称<input id="project-name" required maxlength="200"></label>
  <label>项目目标与说明<textarea id="project-description" maxlength="20000"></textarea></label>
  <label>项目负责人<select id="project-owner" required></select></label>
  <div class="actions"><button class="primary">保存项目</button></div>
 </form>
</dialog>
<dialog id="password-dialog" aria-labelledby="password-title">
 <div class="head"><h2 id="password-title">修改密码</h2><button id="password-close" type="button">关闭</button></div>
 <p id="password-notice" role="status" style="color:var(--warn)"></p>
 <form id="change-password">
  <label id="current-password-field">当前密码<input id="current-password" type="password" autocomplete="current-password" maxlength="128"></label>
  <label>新密码<input id="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="8–128 位"></label>
  <label>确认新密码<input id="confirm-password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
  <p class="muted small">保存后，该用户的旧会话和旧凭据会失效，需要用新密码重新登录。</p>
  <div class="actions"><button class="primary">保存密码</button></div>
 </form>
</dialog>
<dialog id="members-dialog" aria-labelledby="members-title">
 <div class="head"><h2 id="members-title">用户与 Agent</h2><button id="members-close" type="button">关闭</button></div>
 <p id="members-notice" role="status" style="color:var(--warn);margin-top:10px"></p>
 <div id="members-content"></div>
</dialog>
<script>
// ---------- Labels (display only; flow rules stay on the server) ----------
const STATE_LABEL = { ready: '准备', executing: '执行中', accepting: '验收中', checkpoint: '待确认', factcheck: '检查中' };
const ACTOR_LABEL = { owner: '负责人', assignee: '处理人', reviewer: '验收人' };
const ACTION_LABEL = { open: '认领执行', end: '报告主运行结束', submit: '提交结果', review: '验收' };
const REASON_LABEL = {
  task_not_active: '任务已结束或已取消',
  business_credential_required: '需要 Agent 业务凭据',
  not_assigned: '任务未分配给你',
  execution_in_progress: '本轮已有执行在进行',
  previous_execution_not_stopped: '上一次执行尚未确认安全停止',
  step_not_open: '当前步骤还不能执行（检查目标/标准或前置步骤）',
  not_your_execution: '当前执行不属于你的实例',
  execution_not_active: '执行已结束',
  execution_fenced: '执行已失效（取消或被替换）',
  round_changed: '任务已进入新一轮',
  basis_changed: '任务依据已更新，需要重新认领',
  not_reviewer: '你不是本任务验收人',
};
const EXEC_LABEL = { active: '运行中', unknown: '状态未知（停止证据不完整）', ended: '已结束', stopped: '已停止', isolated: '已隔离', 'stop-requested': '已请求停止' };
const OUTCOME_LABEL = { pending: '待验收', approved: '已通过', rejected: '未通过' };
const KIND_LABEL = { comment: '留言', result: '结果', question: '提问', answer: '回答', 'task.created': '创建任务', 'task.basis': '修改约定' };
const AGENT_ACTIONS = ['open', 'end', 'submit'];

// ---------- State ----------
const $ = id => document.getElementById(id);
const prefix = location.pathname.replace(/\/app$/, '');
const retryKeys = new Map();
let selected = '', cursor = '', busy = false, pendingRefresh = false, view = 'mine';
let inboxIDs = new Set(); // tasks currently waiting on the signed-in user

// ---------- Helpers ----------
function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text !== undefined && text !== null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}
function h(tag, cls, ...children) {
  const n = el(tag, undefined, cls);
  for (const c of children) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
function notice(s) { $('project-notice').textContent=$('project-dialog').open?s:''; $('notice').textContent = s; $('members-notice').textContent = $('members-dialog').open ? s : ''; $('password-notice').textContent = $('password-dialog').open ? s : '' }
function formdata(form) { return Object.fromEntries(new FormData(form)) }
function handle(fn) {
  return async e => {
    e?.preventDefault();
    if (busy) return;
    busy = true;
    try { notice(''); await fn(e) } catch (x) { notice(x.message) } finally { busy = false }
  };
}
function button(text, fn, cls = '') {
  const b = el('button', text, cls);
  b.type = 'button';
  b.onclick = handle(fn);
  return b;
}
function field(labelText, input) { const l = el('label', labelText); l.append(input); return l }
function textarea(name, required, placeholder) {
  const t = el('textarea'); t.name = name; t.required = !!required; if (placeholder) t.placeholder = placeholder; return t;
}
function time(v) { return v ? new Date(v).toLocaleString() : '' }
function ago(v) {
  const m = Math.max(0, Math.round((Date.now() - new Date(v)) / 60000));
  return m < 1 ? '刚刚' : m < 60 ? m + ' 分钟前' : m < 1440 ? Math.round(m / 60) + ' 小时前' : Math.round(m / 1440) + ' 天前';
}

// Writes reuse the same Idempotency-Key until a definite answer arrives.
async function api(path, method = 'GET', data, headers = {}) {
  const fingerprint = method + ' ' + path + ' ' + JSON.stringify(data);
  let requestKey = '';
  if (method !== 'GET') {
    requestKey = retryKeys.get(fingerprint) || crypto.randomUUID();
    if (retryKeys.size >= 256) retryKeys.delete(retryKeys.keys().next().value);
    retryKeys.set(fingerprint, requestKey);
  }
  const r = await fetch(prefix + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Taskloom-Request': '1', ...(method === 'GET' ? {} : { 'Idempotency-Key': requestKey }), ...headers },
    ...(data ? { body: JSON.stringify(data) } : {}),
  });
  if (!r.ok) {
    if (r.status >= 400 && r.status < 500) retryKeys.delete(fingerprint);
    if (r.status === 401) showLogin();
    const error = Error(await r.text());
    error.status = r.status;
    throw error;
  }
  const result = await r.json();
  retryKeys.delete(fingerprint);
  return result;
}

// ---------- Status presentation ----------
function stateOf(position) {
  if (position.Status === 'completed') return { text: '已完成', cls: 'done' };
  if (position.Status === 'cancelled') return { text: '已取消', cls: 'stopped' };
  return { text: STATE_LABEL[position.State] || position.State, cls: 'active' };
}
function pill(s) { return el('span', s.text, 'pill ' + s.cls) }

// ---------- Session ----------
// Leaving the session must not leave another user's task details on screen.
let viewer = null;
function showLogin() {
  viewer = null; retryKeys.clear();
  $('account-password').hidden=true;
  $('password-dialog').close();$('change-password').reset();
  $('project-dialog').close();$('catalog-content').replaceChildren();projectID='';
  $('members-dialog').close();
  $('members-content').replaceChildren();
  selected = ''; cursor = ''; inboxIDs = new Set();
  $('detail').replaceChildren(h('div', 'panel empty', '选择左侧任务，或新建一个任务。'));
  $('tasks').replaceChildren();
  $('work').hidden = true; $('login').hidden = false; $('logout').hidden = true;
}
async function start() {
  viewer = await api('/me');
  $('viewer-name').textContent=viewer.Subject+(viewer.Kind==='agent'?' · Agent':'');
  $('account-password').hidden=viewer.Kind!=='human';
  $('account-password').textContent=viewer.PasswordSet?'修改密码':'设置登录密码';
  const p = await api('/changes');
  cursor = p.Cursor;
  // Open on "待我处理" only when something is actually waiting.
  view = (await api('/inbox')).length ? 'mine' : 'all';
  await list();
  $('work').hidden = false; $('login').hidden = true; $('logout').hidden = false;
  if(viewer.Kind==='human' && !viewer.PasswordSet) openPassword();
}

let spaceInfo=null, projects=[], projectID='', taskCache=[], inboxMap=new Map(), editingProject=null;
// ---------- Task list ----------
async function list() {
 const [tasks,inbox,ps,sp]=await Promise.all([api('/tasks'),api('/inbox'),api('/projects'),api('/space')]);
 taskCache=tasks;projects=ps;spaceInfo=sp;inboxMap=new Map(inbox.map(x=>[x.TaskID,x.NextActor]));inboxIDs=new Set(inboxMap.keys());
 $('space-name').textContent=sp.Name;$('mine-count').hidden=!inboxMap.size;$('mine-count').textContent=inboxMap.size;
 for(const name of ['mine','all','projects','space'])$('tab-'+name).classList.toggle('on',view===name);
 const prev=$('project-filter').value;projectOptions($('project-filter'),true);$('project-filter').value=prev;
 const createPrev=$('create-project').value;projectOptions($('create-project'),false);$('create-project').value=projectID||createPrev;if(!$('create-project').value)$('create-project').value='';
 renderBrowse();
 if(selected&&!tasks.some(d=>d.Task.ID===selected)){selected='';notice('任务访问权限已变更')}
 $('browse').hidden=!!selected;$('detail-shell').hidden=!selected;
}
function projectOptions(select,filter=false,current=''){
 select.replaceChildren();
 if(filter){const o=el('option','全部项目');o.value='';select.append(o)}
 const none=el('option','未归属项目');none.value=filter?'none':'';select.append(none);
 for(const p of projects.filter(p=>filter||!p.Archived||p.ID===current)){const o=el('option',p.Name+(p.Archived?'（已归档）':''));o.value=p.ID;select.append(o)}
}
function counts(id){const ts=taskCache.filter(d=>d.Task.ProjectID===id);const done=ts.filter(d=>d.Position.Status==='completed').length;const cancelled=ts.filter(d=>d.Position.Status==='cancelled').length;return `可见任务 ${ts.length} · 完成 ${done} · 未完成 ${ts.length-done-cancelled} · 取消 ${cancelled}`}
function renderBrowse(){
 const root=$('catalog-content');root.replaceChildren();$('task-area').hidden=view==='projects'||view==='space';
 $('page-title').textContent=({mine:'等我处理',all:'全部任务',projects:'项目',space:'空间设置',project:'项目任务'})[view];
 $('create-box').hidden=viewer.Kind!=='human';$('project-filter').hidden=view==='project';
 if(view==='space'){
  const name=el('input');name.name='Name';name.required=true;name.value=spaceInfo.Name;name.maxLength=200;
  const description=textarea('Description');description.value=spaceInfo.Description;description.maxLength=20000;
  name.disabled=description.disabled=!viewer.CanAdmin;
  const form=h('form',null,field('空间名称',name),field('空间说明',description));

// ---------- Task detail ----------
async function show() {
  const path = '/tasks/' + encodeURIComponent(selected);
  const [d, w] = await Promise.all([api(path), api(path + '/workflow')]);
  let commits = d.Commits || [];
  while (commits.length && commits.length % 100 === 0) {
    const page = await api(path + '?after=' + commits.at(-1).Sequence);
    if (!page.Commits.length) break;
    commits.push(...page.Commits);
    if (page.Commits.length < 100) break;
  }
  const ctx = makeContext(d, w, path);
  ctx.candidates = (d.CanEdit || w.CanAssign) ? await api(path + "/candidates") : [];
  ctx.commits = new Map(commits.map(c => [c.ID, c]));
  $('detail').replaceChildren(
    renderHead(ctx),
    renderProject(ctx),
    renderNext(ctx),
    h('div', 'cols',
      h('div', null, renderResult(ctx), renderTimeline(ctx, commits)),
      h('div', null, renderBasis(ctx), renderExecution(ctx), renderParticipants(ctx), renderManage(ctx), renderAgentDebug(ctx))));
}

function makeContext(d, w, path) {
  const ex = w.Execution;
  const active = w.Position.Status === 'active';
  return {
    d, w, ex, active, path,
    base: { RoundID: w.Position.RoundID, BasisVersion: d.Task.BasisVersion, ExpectedRevision: w.Position.Revision },
    ref: ex ? { ExecutionID: ex.ID, Generation: ex.Generation } : {},
    running: !!ex && !ex.Safe,
    // Blocked only lists agent actions for agent viewers, so this marks an agent session.
    isAgent: w.ViewerKind === 'agent',
    // Refresh the list first: it decides which tasks are waiting on me.
    async send(route, input) { await api(path + route, 'POST', input); await list(); await show() },
  };
}

 return box;

function renderNext(ctx) {
  const { d, w, active, base } = ctx;
  const panel = h('div', 'panel next' + (inboxIDs.has(d.Task.ID) ? ' mine' : ''));
  const s = stateOf(w.Position);
  let title;
  if (w.Position.Status === 'completed') title = '已完成：结果与验收已满足，执行已安全退出';
  else if (w.NextActor) title = '下一步等待：' + ACTOR_LABEL[w.NextActor];
  else title = w.Position.Complete ? '当前步骤已完成' : '暂无需要处理的事项';
  panel.append(h('div', 'head', el('h3', title), pill(s)));
  if (w.Questions?.length) panel.append(el('p', '处理人提出了问题，回答前任务不能完成。', 'muted'));
  else if (w.Position.Waiting) panel.append(el('p', w.Position.Waiting, 'muted'));
  if (w.Blocked?.review && !ctx.isAgent) panel.append(el('p', '暂不能验收：' + (REASON_LABEL[w.Blocked.review] || w.Blocked.review), 'muted'));

  renderQuestions(ctx, panel);
  if (!ctx.isAgent && w.ViewerKind === 'human') {
    if (w.CanOpen) panel.append(h('div', 'actions', button('开始处理', () => ctx.send('/execution/open', base), 'primary')));
    if (w.CanSubmit) {
      const body = textarea('Body', true, '填写本次任务的处理结果');
      const form = h('form', null, field('提交处理结果', body), h('div', 'actions', el('button', '提交结果', 'primary')));
      form.onsubmit = handle(() => ctx.send('/results', { ...base, ...ctx.ref, Body: body.value }));
      panel.append(form);
    }
  }
  const actions = h('div', 'actions');
  // Review is the main human decision; it lives here, next to the result summary.
  if (w.CanReview && w.Submission && w.Review?.Outcome === 'pending') {
    panel.classList.add('mine');
    const reason = el('input');
    reason.placeholder = '验收意见（不通过时必填）';
    reason.setAttribute('aria-label', '验收意见');
    const sub = w.Submission;
    const verdict = outcome => {
      if (outcome === 'rejected' && !reason.value.trim()) { reason.focus(); throw Error('验收不通过时请写明需要修改的地方') }
      return ctx.send('/review', { ...base, SubmissionID: sub.ID, CommitID: sub.CommitID, Outcome: outcome, Reason: reason.value });
    };
    panel.append(h('div', null, el('label', '验收当前结果'), reason));
    actions.append(button('验收通过', () => verdict('approved'), 'primary'), button('不通过，退回修改', () => verdict('rejected'), 'danger'));
  }
  // Assigning an executor is the owner's next step when nobody is assigned yet.
  if (w.CanAssign && active && w.SafeToExit && !w.Assignee && w.NextActor === 'owner') {
    panel.classList.add('mine');
    panel.append(assignForm(ctx, '选择处理人'));
  }
  if (!active && w.CanManage && w.SafeToExit) actions.append(button('重开任务', () => confirmThen('重开会开始新一轮，旧结果保留在历史中。继续？', () => ctx.send('/reopen', base))));
  if (actions.children.length) panel.append(actions);
  return panel;
}

// Open requests for input from the executor. Only the addressee (the owner,
// who then has the task in "待我处理") gets an answer box.
function renderQuestions(ctx, panel) {
  const qs = ctx.w.Questions || [];
  if (!qs.length) return;
  const canAnswer = ctx.w.NextActor === 'owner' && inboxIDs.has(ctx.d.Task.ID) && !ctx.isAgent;
  for (const q of qs) {
    const asked = ctx.commits?.get(q.CommitID);
    const box = h('div', 'result',
      el('div', q.Asker + ' 提问 · ' + time(q.CreatedAt), 'muted small'),
      el('p', asked ? asked.Body : '（问题正文见时间线）'));
    if (canAnswer) {
      const body = textarea('Body', true, '回答后处理人可在任务中查看');
      const f = h('form', null, body, h('div', 'actions', el('button', '回答', 'primary')));
      f.onsubmit = handle(() => ctx.send('/questions/' + encodeURIComponent(q.ID) + '/answer', { Body: body.value }));
      box.append(f);
    }
    panel.append(box);
  }
  if (canAnswer) panel.classList.add('mine');
}

    for (const a of blocked) ul.append(el('li', '暂不能' + ACTION_LABEL[a] + '：' + (REASON_LABEL[w.Blocked[a]] || w.Blocked[a])));

  if (actions.children.length) panel.append(actions);
  if (ctx.active) {
    const q = textarea('Body', true, '说明问题、为什么卡住、可选方案和建议');
    const f = h('form', null, field('向负责人提问（未回答前任务不能完成）', q), h('div', 'actions', el('button', '提问')));
    f.onsubmit = handle(() => send('/questions', { RoundID: w.Position.RoundID, Body: q.value }));
    panel.append(f);
  }
  if (w.CanSubmit) {
    const body = textarea('Body', true, '这是正式交付的结果正文');
    const f = h('form', null, field('提交结果', body), h('div', 'actions', el('button', '提交结果', 'primary')));
    f.onsubmit = handle(() => send('/results', { ...base, ...ref, Body: body.value }));
    panel.append(f);
  }
  return panel;
}

// ---------- Member administration ----------
async function openMembers(preselect = '') {
  $('members-notice').textContent = '';
  const root = $('members-content');
  root.replaceChildren(); // Never retain a previously issued secret across reloads.
  const members = await api('/members');
  if (!$('members-dialog').open) $('members-dialog').showModal();
  const directory = h('section', null, el('h3', '已登记成员'));
  for (const m of members) {
    const actions = h('div', 'actions');
    if(m.Kind==='human') actions.append(button('设置 / 重置密码',()=>openPassword(m.Subject)));
    if (m.Active && m.Kind==='agent') actions.append(button('签发凭据', () => { subject.value = m.Subject; binding(); credentialForm.scrollIntoView({block:'center'}); }));
    if (m.Subject !== viewer.Subject) actions.append(button(m.Active ? '停用' : '启用', () => confirmThen(
      m.Active ? '停用后，该成员将不能访问和处理任务。继续？' : '启用后将恢复仍保留的任务关系。继续？',
      async () => { await api('/members', 'POST', {Tenant:viewer.Tenant,Subject:m.Subject,Role:m.Role,Active:!m.Active}); await openMembers(); }), m.Active ? 'danger' : ''));
    directory.append(h('article', 'member-row', h('div', null, el('strong',m.Subject),
      el('p',(m.Kind === 'agent' ? 'Agent · 所属人：'+m.OwnerID : '用户')+' · '+(m.Role === 'admin' ? '管理员' : '成员')+' · '+(m.Active ? '已启用' : '已停用'),'muted small')),actions));
  }
  root.append(directory);
  const kind=el('select');
  for (const [value,text] of [['human','用户'],['agent','Agent']]) {const o=el('option',text);o.value=value;kind.append(o)}
  const id=el('input');id.required=true;id.maxLength=128;id.placeholder='例如 zhangsan 或 assistant-1';
  const initialPassword=el('input');initialPassword.type='password';initialPassword.autocomplete='new-password';initialPassword.minLength=8;initialPassword.maxLength=128;initialPassword.placeholder='8–128 位';
  const passwordField=field('初始密码',initialPassword);
  const owner=memberSelect(members.filter(m=>m.Kind==='human' && m.Active),'请选择所属用户');
  const ownerField=field('Agent 所属用户',owner);
  function chooseKind(){ownerField.hidden=kind.value!=='agent';owner.required=kind.value==='agent';passwordField.hidden=kind.value!=='human';initialPassword.required=kind.value==='human';if(kind.value==='agent')initialPassword.value=''}
  kind.onchange=chooseKind;chooseKind();
  const create=h('form',null,el('h3','添加用户或 Agent'),field('成员类型',kind),field('用户名 / Agent 标识',id),passwordField,ownerField,
    el('p','用户创建后即可用用户名和密码登录；Agent 添加后再签发接入凭据。','muted small'),h('div','actions',el('button','添加成员','primary')));
  create.onsubmit=handle(async()=>{
    const subjectID=id.value.trim();
    await api('/identities','POST',{Subject:subjectID,Kind:kind.value,OwnerID:kind.value==='agent'?owner.value:'',Password:kind.value==='human'?initialPassword.value:''});
    const human=kind.value==='human';
    await openMembers(human?'':subjectID);
    notice(human?'用户已创建，可用用户名和密码登录。':'Agent 已添加，请签发接入凭据。');
  });
  root.append(h('section',null,create));
  const active=members.filter(m=>m.Active && m.Kind==='agent');
  const subject=memberSelect(active,'请选择签发对象');
  if (active.some(m=>m.Subject===preselect)) subject.value=preselect;
  const days=el('select');
  for (const n of [1,7,30,90]) {const o=el('option',n+' 天');o.value=n;days.append(o)}
  days.value='7';
  const instance=el('input');instance.value='instance-'+crypto.randomUUID().slice(0,8);
  const incarnation=el('input');incarnation.value=crypto.randomUUID();
  const purpose=el('select');
  for (const [value,text] of [['business','任务处理（business）'],['runtime','运行时停止证明（runtime）']]) {const o=el('option',text);o.value=value;purpose.append(o)}
  const agentFields=h('div',null,field('运行实例标识',instance),field('本次启动标识',incarnation),field('凭据用途',purpose),
    el('p','使用同一实例和启动标识签发配套凭据；新实例或重启请使用新标识。','muted small'));
  function binding(){const agent=members.find(m=>m.Subject===subject.value)?.Kind==='agent';agentFields.hidden=!agent;instance.required=agent;incarnation.required=agent}
  subject.onchange=binding;binding();
  const result=h('div',null);result.id='issued-credential';
  const credentialForm=h('form',null,el('h3','签发 Agent 接入凭据'),field('签发对象',subject),field('有效期',days),agentFields,
    h('div','actions',el('button','生成凭据','primary')),result);
  let pendingIssue=null;
  credentialForm.onsubmit=handle(async()=>{
    result.replaceChildren();
    const member=members.find(m=>m.Subject===subject.value);
    const fields={Subject:subject.value,Days:days.value};
    if(member.Kind==='agent') Object.assign(fields,{InstanceID:instance.value,Incarnation:incarnation.value,Purpose:purpose.value});
    const fingerprint=JSON.stringify(fields);
    if(!pendingIssue || pendingIssue.fingerprint!==fingerprint) pendingIssue={fingerprint,input:{Subject:subject.value,ExpiresAt:new Date(Date.now()+Number(days.value)*86400000).toISOString()}};
    const input=pendingIssue.input;
    if(member.Kind==='agent') Object.assign(input,{InstanceID:instance.value,Incarnation:incarnation.value,Purpose:purpose.value});
    const issued=await api('/credentials','POST',input);
    pendingIssue=null;
    if(!issued.Secret){result.append(el('p','这次请求已签发过凭据，明文不能重新读取。请先撤销该凭据，再生成新的凭据。','muted'));}
    else {
      const secret=el('textarea');secret.readOnly=true;secret.value=issued.Secret;secret.autocomplete='off';
      const download=()=>{
        const blob=new Blob([JSON.stringify({...input,ID:issued.ID,Secret:issued.Secret,Server:location.origin+prefix},null,2)],{type:'application/json'});
        const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='taskloom-credential.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
      };
      result.append(el('p','请立即复制或下载并妥善保管。关闭窗口后将不再展示明文；新增凭据不会自动撤销旧凭据。','muted'),field('本次生成的凭据',secret),
        h('div','actions',button('复制凭据',async()=>{await navigator.clipboard.writeText(issued.Secret);notice('凭据已复制')}),button('下载凭据文件',download)));
    }
    result.append(el('p','凭据编号：'+issued.ID,'muted small'),button('撤销本次凭据',async()=>{await api('/credentials/revoke','POST',{CredentialID:issued.ID});result.replaceChildren(el('p','凭据已撤销'))},'danger'));
  });
  if(active.length) root.append(h('section',null,credentialForm));
  if(preselect) credentialForm.scrollIntoView({block:'center'});
}

// ---------- Password account flow ----------
let passwordTarget=null;
function openPassword(target=null){
  passwordTarget=target;$('change-password').reset();$('password-notice').textContent='';
  const needsCurrent=!target && viewer.PasswordSet;
  $('current-password-field').hidden=!needsCurrent;$('current-password').required=needsCurrent;
  $('password-title').textContent=target?'为 '+target+' 设置密码':viewer.PasswordSet?'修改登录密码':'设置登录密码';
  if(!$('password-dialog').open)$('password-dialog').showModal();
}
$('account-password').onclick=()=>openPassword();
$('password-close').onclick=()=>{$('change-password').reset();$('password-dialog').close()};
$('password-dialog').addEventListener('close',()=>{$('change-password').reset()});
$('password-dialog').addEventListener('cancel',()=>{$('change-password').reset()});
$('change-password').onsubmit=handle(async()=>{
  if($('new-password').value!==$('confirm-password').value)throw Error('两次输入的密码不一致');
  const subject=viewer.Subject, target=passwordTarget;
  const body={Password:$('new-password').value};
  if(!target)body.CurrentPassword=$('current-password').value;
  await api(target?'/users/'+encodeURIComponent(target)+'/password':'/account/password','POST',body);
  $('change-password').reset();$('password-dialog').close();
  if(!target || target===subject){await api('/session','DELETE');showLogin();$('username').value=subject;notice('密码已设置，请用用户名和新密码登录。')}
  else notice('用户密码已更新，旧会话已失效。');
});
$('password-login').onsubmit=handle(async()=>{
  try{await api('/session','POST',{Username:$('username').value.trim(),Password:$('password').value});await start()}
  finally{$('password').value=''}
});

// ---------- Wiring ----------
$('credential-login').onsubmit = handle(async () => {
  await api('/session', 'POST', null, { Authorization: 'Bearer ' + $('token').value });
  $('token').value = '';
  await start();
});
$('create').onsubmit = handle(async () => {
  const d = await api('/tasks', 'POST', formdata($('create')));
  selected = d.Task.ID;
  $('create').reset();
  $('create-box').open = false;
  if(view!=='project') view = 'all';
  await list();
  await show();
});
$('logout').onclick = handle(async () => {
  await api('/session', 'DELETE');
  showLogin();
});
$('refresh').onclick = handle(async () => { await list(); if (selected) await show() });



// Poll the authorized change feed; never overwrite a form the user is editing.
setInterval(async () => {
  if (!cursor || busy || $('work').hidden) return;
  try {
    const p = await api('/changes?cursor=' + encodeURIComponent(cursor));
    cursor = p.Cursor;
    pendingRefresh = pendingRefresh || p.Changes.length > 0;
    const editing = document.activeElement?.matches('input,textarea,select') || (view==='space') || $('create-box').open;
    if (pendingRefresh && !editing && !document.querySelector('dialog[open]')) {
      await list();
      if (selected) await show();
      pendingRefresh = false;
    } else if (selected) {
      const state = await api('/tasks/' + encodeURIComponent(selected) + '/workflow');
      const live = $('execution-live-status');
      if (live) live.textContent = '实时：' + (state.Assignee || '待分配') + (state.Execution ? ' · 第 ' + state.Execution.Generation + ' 代 · ' + (EXEC_LABEL[state.Execution.Status] || state.Execution.Status) : '');
      if (pendingRefresh && editing) notice('任务有新变化，已保留你的输入；完成编辑后刷新。');
    }
  } catch (e) {
    cursor = '';
    if (e.status === 403) {
      selected = '';
      $('tasks').replaceChildren();
      $('detail').replaceChildren(h('div', 'panel empty', '访问权限已变更'));
    }
    notice(e.message + '；请刷新同步。');
  }
}, 4000);

start().catch(() => {});
