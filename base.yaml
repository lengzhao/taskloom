# Implemented M05 graph: SQLite workspace and execution/result/acceptance protocol; no Agent runtime.
server:
  use: server
  config:
    shutdownTimeout: 10s
  deps:
    resources: [sql]
    components: [http]
http:
  use: transport/http
  config:
    listen: 127.0.0.1:8080
    apiPrefix: /v1
  deps:
    modules: [health, workspace-api, workflow-api, mcp-api]
health:
  use: api/health

sql:
  use: storage/sql
  config:
    driver: sqlite
    dsn: taskloom.db

identity:
  use: identity/local
  deps:
    store: sql
access:
  use: access/default
  deps:
    store: sql
    tasks: sql
ready:
  use: state/ready
flow:
  use: flow/directory
  config:
    defaultID: standard
    defaultVersion: '1'
  deps:
    positions: sql
    flows: [flow-preparation, flow-standard]
flow-preparation:
  use: task/flow
  config:
    id: preparation
    version: '1'
  deps:
    definitions: sql
    positions: sql
    states: [ready]
flow-standard:
  use: task/flow
  config:
    id: standard
    version: '1'
  deps:
    definitions: sql
    positions: sql
    executions: sql
    questions: sql
    states: [ready, executing, accepting, completed]
executing:
  use: state/executing
  deps:
    results: sql
accepting:
  use: state/accepting
  deps:
    results: sql
    reviews: sql
    members: sql
completed:
  use: state/completed
  deps:
    results: sql
command-runtime:
  use: commands/runtime
  deps:
    transactions: sql
    requests: sql
    identity: identity
    authorization: access
    audit: sql
    events: sql
security:
  use: commands/security
  deps:
    passwords: sql
    commands: command-runtime
    transactions: sql
    principals: sql
    credentials: sql
    bootstrap: sql
    members: sql
    audit: sql
    events: sql
catalog:
  use: catalog/projects
  deps:
    transactions: sql
    identity: identity
    members: sql
    store: sql
    commands: command-runtime
workspace:
  use: workspace/tasks
  deps:
    catalog: sql
    members: sql
    participants: sql
    transactions: sql
    tasks: sql
    commits: sql
    flow: flow
    identity: identity
    authorization: access
    commands: command-runtime
    events: sql
    progress: execution-commands
workspace-api:
  use: api/workspace
  config:
    origin: http://127.0.0.1:8080
    localHTTP: true
  deps:
    commands: workspace
    queries: workspace
    changes: workspace
    identity: identity
    security: security
    catalog: catalog

workflow-query:
  use: query/workflow
  deps:
    questions: sql
    commits: sql
    transactions: sql
    tasks: sql
    flow: flow
    executions: sql
    results: sql
    reviews: sql
    identity: identity
    authorization: access
execution-commands:
  use: commands/execution
  deps:
    participants: sql
    principals: sql
    members: sql
    commands: command-runtime
    tasks: sql
    flow: flow
    executions: sql
    snapshots: workflow-query
    events: sql
result-commands:
  use: commands/result
  deps:
    commands: command-runtime
    tasks: sql
    flow: flow
    executions: sql
    results: sql
    commits: sql
    accepting: accepting
    snapshots: workflow-query
    events: sql
question-commands:
  use: commands/question
  deps:
    commands: command-runtime
    tasks: sql
    flow: flow
    commits: sql
    questions: sql
    progress: execution-commands
    snapshots: workflow-query
    events: sql
flow-commands:
  use: commands/flow
  deps:
    commands: command-runtime
    tasks: sql
    flow: flow
    executions: sql
    snapshots: workflow-query
    events: sql

workflow-api:
  use: api/workflow
  deps:
    executions: execution-commands
    results: result-commands
    controls: flow-commands
    workflow: workflow-query
    questions: question-commands
    security: workspace-api
mcp-api:
  use: api/mcp
  deps:
    tasks: workspace
    comments: workspace
    workflow: workflow-query
    executions: execution-commands
    results: result-commands
    questions: question-commands
    security: workspace-api
