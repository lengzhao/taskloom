# Implemented M03 graph: SQLite storage + process health; no task/Agent APIs.
server:
  use: server
  config:
    shutdownTimeout: 10s
  deps:
    resources: [sql]
    components: [http]
http:
  use: transport/http
  config:
    listen: 127.0.0.1:8080
    apiPrefix: /v1
  deps:
    modules: [health]
health:
  use: api/health

sql:
  use: storage/sql
  config:
    driver: sqlite
    dsn: taskloom.db
