# Implemented M05 graph: SQLite workspace and execution/result/acceptance protocol; no Agent runtime.
server:
  use: server
  config:
    shutdownTimeout: 10s
  deps:
    resources: [sql]
    components: [http]
http:
  use: transport/http
  config:
    listen: 127.0.0.1:8080
    apiPrefix: /v1
    # The one browser origin allowed; plain http only for a loopback host.
    origin: http://127.0.0.1:8080
  deps:
    modules: [health, workspace-api, workflow-api, mcp-api, audit-api]
health:
  use: api/health

sql:
  use: storage/sql
  config:
    driver: sqlite
    dsn: taskloom.db

identity:
  use: identity/local
  deps:
    store: sql
access:
  use: access/default
  deps:
    store: sql
    tasks: sql
flow:
  use: task/flow
  config:
    acceptance: manual
  deps:
    positions: sql
    results: sql
    reviews: sql
    questions: sql
    executions: sql
command-runtime:
  use: commands/runtime
  deps:
    transactions: sql
    requests: sql
    identity: identity
    authorization: access
    audit: sql
security:
  use: commands/security
  deps:
    passwords: sql
    commands: command-runtime
    transactions: sql
    principals: sql
    credentials: sql
    bootstrap: sql
    members: sql
    audit: sql
    events: sql
catalog:
  use: catalog/projects
  deps:
    transactions: sql
    identity: identity
    members: sql
    store: sql
    commands: command-runtime
    events: sql
workspace:
  use: workspace/tasks
  deps:
    catalog: sql
    members: sql
    participants: sql
    transactions: sql
    tasks: sql
    commits: sql
    flow: flow
    identity: identity
    authorization: access
    commands: command-runtime
    events: sql
    progress: execution-commands
workspace-api:
  use: api/workspace
  deps:
    commands: workspace
    queries: workspace
    changes: workspace
    identity: identity
    security: security
    catalog: catalog

workflow-query:
  use: query/workflow
  deps:
    questions: sql
    commits: sql
    transactions: sql
    tasks: sql
    flow: flow
    executions: sql
    results: sql
    reviews: sql
    identity: identity
    authorization: access
execution-commands:
  use: commands/execution
  deps:
    participants: sql
    principals: sql
    members: sql
    commands: command-runtime
    tasks: sql
    flow: flow
    executions: sql
    events: sql
result-commands:
  use: commands/result
  deps:
    commands: command-runtime
    tasks: sql
    flow: flow
    executions: sql
    results: sql
    commits: sql
    events: sql
question-commands:
  use: commands/question
  deps:
    commands: command-runtime
    tasks: sql
    flow: flow
    commits: sql
    questions: sql
    progress: execution-commands
    relations: sql
    events: sql
flow-commands:
  use: commands/flow
  deps:
    commands: command-runtime
    tasks: sql
    flow: flow
    executions: sql
    events: sql

workflow-api:
  use: api/workflow
  deps:
    executions: execution-commands
    results: result-commands
    controls: flow-commands
    workflow: workflow-query
    questions: question-commands
mcp-api:
  use: api/mcp
  deps:
    tasks: workspace
    comments: workspace
    workflow: workflow-query
    executions: execution-commands
    results: result-commands
    questions: question-commands
audit-api:
  use: api/audit
  deps:
    transactions: sql
    identity: identity
    authorization: access
    audit: sql
