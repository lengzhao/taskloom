# Merge this fragment into the same deployment config.yaml; never add a third layer.
flow:
  config:
    defaultID: with-checkpoint
    defaultVersion: '1'
  deps:
    flows: [flow-preparation, flow-standard, flow-checkpoint]
flow-checkpoint:
  use: task/flow
  config:
    id: with-checkpoint
    version: '1'
  deps:
    definitions: sql
    positions: sql
    executions: sql
    questions: sql
    states: [ready, executing, checkpoint, accepting, completed]
checkpoint:
  use: state/checkpoint
  deps:
    records: sql
    results: sql
checkpoint-api:
  use: api/checkpoint
  deps:
    commands: command-runtime
    tasks: sql
    flow: flow
    step: checkpoint
    security: workspace-api
    authorization: access
    events: sql
http:
  deps:
    modules: [health, workspace-api, workflow-api, mcp-api, checkpoint-api]
