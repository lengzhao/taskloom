# Implemented minimal graph. Process liveness only; no task/storage/Agent behavior.
server:
  use: server
  config:
    shutdownTimeout: 10s
  deps:
    resources: []
    components: [http]
http:
  use: transport/http
  config:
    listen: 127.0.0.1:8080
    apiPrefix: /v1
  deps:
    modules: [health]
health:
  use: api/health
